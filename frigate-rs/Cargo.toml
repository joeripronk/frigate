[workspace]
members = ["crates/frgated", "crates/frgated-core", "crates/frgated-ipc"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
memmap2 = "0.9"
crossbeam = "0.8"
zmq = "0.10"
nix = { version = "0.29", features = ["process", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "regexp", "sqlx-macros"] }
chrono = { version = "0.4", features = ["serde"] }

frgated-core = { path = "crates/frgated-core" }
frgated-ipc = { path = "crates/frgated-ipc" }
