[workspace]
members = ["crates/frgated", "crates/frgated-core", "crates/frgated-ipc"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
memmap2 = "0.9"
crossbeam = "0.8"
zmq = "0.10"
nix = { version = "0.29", features = ["process", "signal"] }

frgated-core = { path = "crates/frgated-core" }
frgated-ipc = { path = "crates/frgated-ipc" }
